// core-assistant: tutto quello che Aria sa fare senza disegnare niente. Nessuna dipendenza da
// Compose, cosi' i test girano sulla JVM: contesto e registry dei tool, pre-router, prompt,
// runtime, memoria, tracker dei consumi, voce, client delle app collegate.
plugins {
  alias(libs.plugins.android.library)
  alias(libs.plugins.kotlin.android)
  alias(libs.plugins.kotlin.serialization)
  alias(libs.plugins.ksp)
  alias(libs.plugins.hilt)
}

android {
  namespace "dev.pampa.pampai.core.assistant"
  compileSdk 36

  defaultConfig {
    minSdk 29
  }

  buildFeatures {
    buildConfig false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  sourceSets {
    main.java.setSrcDirs(["src/main/kotlin"])
    test.java.setSrcDirs(["src/test/kotlin"])
    // Gli schemi esportati da Room, come asset dei test: MigrationTestHelper li legge da li' per
    // creare un database alla versione di prima e controllare quello migrato.
    test.assets.srcDirs += files("$projectDir/schemas")
  }

  testOptions {
    unitTests {
      // Robolectric (le migrazioni e il repository su un Room vero) vuole risorse e asset.
      includeAndroidResources = true
    }
  }
}

// Lo schema di Room finisce nel repo a ogni versione: e' la storia contro cui scrivere (e
// verificare) la prossima migrazione, invece di scoprire il buco sul telefono di qualcuno.
ksp {
  arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
  // Il trasporto e l'orchestrazione senza dominio stanno nell'engine; qui c'e' il dominio di Aria.
  api project(":engine-ai")
  api project(":engine-ai-bridge")
  api project(":engine-storage")
  implementation project(":engine-net")
  // Il file di controllo remoto: kill switch e flag, letti da chi deve obbedire.
  implementation project(":engine-config")

  implementation libs.androidx.core.ktx
  implementation libs.hilt.android
  implementation libs.serialization.json
  implementation libs.kotlinx.coroutines.android
  implementation libs.datastore.preferences
  // Le conversazioni, la memoria, i consumi, i promemoria.
  implementation libs.room.runtime
  implementation libs.room.ktx
  // Le pagine web ridotte a testo; i PDF allegati estratti in testo per i modelli che non li leggono.
  implementation libs.jsoup
  implementation libs.pdfbox.android
  // I conti esatti: il modello non fa aritmetica a mente.
  implementation libs.exp4j
  // Il controllo di Fluidify via MediaBrowser (media3), con i future di Guava in coroutine.
  implementation libs.media3.session
  implementation libs.media3.common
  implementation libs.kotlinx.coroutines.guava

  ksp libs.hilt.compiler
  ksp libs.room.compiler

  testImplementation libs.junit4
  testImplementation libs.kotlinx.coroutines.test
  // Room vero sulla JVM: le migrazioni con MigrationTestHelper e il repository su un database in
  // memoria. Stessa versione di Robolectric di feature-assistant, stessa di Room del resto.
  testImplementation "org.robolectric:robolectric:4.16"
  testImplementation "androidx.room:room-testing:${libs.versions.room.get()}"
  testImplementation "androidx.test:core:1.6.1"
}
